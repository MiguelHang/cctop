[package]
name = "cctop"
version = "0.1.0"
edition = "2024"
description = "A btop for cornercase: memory, CPU and Claude context per project, workspace, tab and pane"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cctop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
ratatui = "0.30.2"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
rstest = "0.27.0"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
