name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: versions match the tag
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: .github/versions.sh "$GITHUB_REF_NAME"

      - name: the changelog has the version
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: .github/notes.sh "$GITHUB_REF_NAME" >/dev/null

      - name: versions match
        if: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}
        run: .github/versions.sh

  build:
    name: build (${{ matrix.target }})
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: build
        run: cargo build --release --locked --target "$TARGET"

      - name: package
        run: .github/package.sh "$TARGET" dist

      - name: check the archive
        run: |
          tar -tzvf "dist/cctop-$TARGET.tar.gz"
          tar -tzf "dist/cctop-$TARGET.tar.gz" | grep -qx 'target/release/cctop'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cctop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: cctop-*
          merge-multiple: true

      - name: verify the sha256
        working-directory: dist
        run: sha256sum --check ./*.sha256

      - name: notes from the changelog
        run: .github/notes.sh "$GITHUB_REF_NAME" >notes.md

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*

  point-downloads:
    name: point downloads at the release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: cctop-*
          merge-multiple: true

      - name: write [download] into the manifest
        run: .github/downloads.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" dist

      - name: versions still match
        run: .github/versions.sh

      - name: open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="chore/downloads-$GITHUB_REF_NAME"
          title="chore: point downloads at $GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add cornercase-plugin.toml
          git commit -m "$title"
          git push --force origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base "$BASE" --head "$branch" --title "$title" \
            --body "Points \`[download.<target>]\` at the archives of $GITHUB_REF_NAME, so \`cornercase plugin install\` downloads instead of building."
