id = "cctop"
name = "cctop"
version = "0.2.0"
api = 1
min_cornercase = "0.12.187"
description = "A btop for cornercase: memory and CPU per project, workspace, tab and pane, and what fills Claude's context"
platforms = ["linux", "macos"]
permissions = ["read", "notify", "split", "focus"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[button]
title = "cctop"
icon = "◔"

[[actions]]
id = "cctop"
title = "cctop"
contexts = ["button", "project", "workspace", "tab", "pane"]
placement = "popup"
command = ["target/release/cctop"]

[[actions]]
id = "split"
title = "cctop in a split"
contexts = ["pane"]
command = ["target/release/cctop", "open"]

[[service]]
id = "watch"
command = ["target/release/cctop", "watch"]

